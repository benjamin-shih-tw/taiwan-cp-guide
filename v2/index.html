<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Coding Course</title>
  <meta name="description" content="Competitive programming course">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home">Coding Course</a>
    <nav class="main-nav">
      <a href="#/roadmap" data-nav="roadmap">單元</a>
      <a href="#/courses" data-nav="courses">課程</a>
      <a href="#/problems" data-nav="problems">題庫</a>
      <a href="#/resources" data-nav="resources">資源</a>
    </nav>
    <div class="top-actions">
      <button id="search-open" class="icon-btn" aria-label="搜尋">⌕</button>
      <button id="theme-toggle" class="icon-btn" aria-label="切換深淺色">◐</button>
    </div>
  </header>

  <main id="app">
    <section class="view active" data-view="home">
      <header class="home-head">
        <h1>Coding Course</h1>
        <p>Competitive Programming</p>
      </header>

      <div class="stats-strip">
        <div><strong id="stat-topics">0</strong><span>課程</span></div>
        <div><strong id="stat-problems">0</strong><span>題目</span></div>
        <div><strong id="stat-progress">0%</strong><span>進度</span></div>
        <div><strong id="stat-levels">0</strong><span>單元</span></div>
      </div>

      <section class="section-block">
        <div class="section-heading"><h2>單元</h2><a href="#/roadmap">全部</a></div>
        <div id="domain-cards" class="domain-grid"></div>
      </section>

      <section class="continue-card">
        <div>
          <small>繼續</small>
          <h2 id="continue-title"></h2>
          <p id="continue-desc"></p>
        </div>
        <button id="continue-btn" class="btn primary">開啟</button>
      </section>

      <div id="path-cards" hidden></div>
    </section>

    <section class="view" data-view="roadmap">
      <div class="page-head"><h1>單元</h1></div>
      <div id="roadmap-filters" class="chip-row"></div>
      <div id="roadmap-view" class="roadmap-stack"></div>
    </section>

    <section class="view" data-view="courses">
      <div class="page-head"><h1>課程</h1></div>
      <div class="toolbar">
        <label class="searchbox"><span>⌕</span><input id="course-search" type="search" placeholder="搜尋"></label>
        <select id="course-domain"><option value="all">全部單元</option></select>
        <select id="course-level"><option value="all">全部難度</option><option value="beginner">入門</option><option value="intermediate">中階</option><option value="advanced">進階</option></select>
      </div>
      <div id="courses-grid"></div>
      <div id="course-empty" class="empty-state" hidden>沒有結果</div>
    </section>

    <section class="view" data-view="problems">
      <div class="page-head"><h1>題庫</h1></div>
      <div class="toolbar">
        <label class="searchbox"><span>⌕</span><input id="problem-search" type="search" placeholder="搜尋"></label>
        <select id="problem-platform"><option value="all">全部平台</option></select>
        <label class="check-control"><input id="hide-solved" type="checkbox"> 隱藏完成</label>
      </div>
      <div id="problem-progress" class="progress-card"></div>
      <div id="problem-ladder" class="problem-ladder"></div>
    </section>

    <section class="view" data-view="resources">
      <div class="page-head"><h1>資源</h1></div>
      <div class="resource-grid">
        <a class="resource-card" href="https://benjamin-shih-tw.github.io/algovista-algorithm-library/" target="_blank" rel="noreferrer"><strong>Algovista</strong><span>動畫</span></a>
        <a class="resource-card" href="https://usaco.guide/" target="_blank" rel="noreferrer"><strong>USACO Guide</strong><span>Guide</span></a>
        <a class="resource-card" href="https://oi-wiki.org/" target="_blank" rel="noreferrer"><strong>OI Wiki</strong><span>Wiki</span></a>
        <a class="resource-card" href="../legacy.html"><strong>Tools</strong><span>其他工具</span></a>
      </div>
      <section class="section-block compact">
        <div class="section-heading"><h2>模板</h2></div>
        <div id="template-grid" class="template-grid"></div>
      </section>
    </section>
  </main>

  <footer>© 2026 Coding Course</footer>

  <aside id="lesson-overlay" class="lesson-overlay" aria-hidden="true">
    <div class="lesson-shell">
      <header class="lesson-topbar">
        <button id="lesson-close" class="icon-btn">←</button>
        <div id="lesson-breadcrumb" class="lesson-breadcrumb"></div>
        <button id="lesson-mark" class="btn small ghost">標記完成</button>
      </header>
      <div class="lesson-layout">
        <article class="lesson-article">
          <div class="lesson-head">
            <div id="lesson-tags" class="tag-row"></div>
            <h1 id="lesson-title"></h1>
            <p id="lesson-desc"></p>
          </div>
          <div id="lesson-prereq" class="prereq-box"></div>
          <div id="lesson-content" class="markdown-body"></div>
          <section class="lesson-end"><h2>練習</h2><div id="lesson-problems"></div></section>
        </article>
        <aside class="lesson-side">
          <div class="side-card">
            <div id="lesson-progress-label">未開始</div>
            <div class="mini-progress"><span id="lesson-progress-fill"></span></div>
          </div>
          <div class="side-card"><div id="lesson-toc" class="toc"></div></div>
        </aside>
      </div>
    </div>
  </aside>

  <div id="search-modal" class="search-modal" aria-hidden="true">
    <div class="search-dialog">
      <div class="search-dialog-head"><span>⌕</span><input id="global-search" placeholder="搜尋" autocomplete="off"><button id="search-close">Esc</button></div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../data/roadmap.js"></script>
  <script src="../data/templates.js"></script>
  <script src="../data/notion_courses_part1.js"></script>
  <script src="../data/notion_courses_part2.js"></script>
  <script src="../data/notion_courses_part3.js"></script>
  <script src="../data/notion_courses_part4.js"></script>
  <script src="../data/notion_courses_part5.js"></script>
  <script src="../data/notion_domain_relations.js"></script>
  <script src="app.js"></script>
</body>
</html>
