<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Coding Course v3 — structured competitive-programming lessons, source-preserving reader, problem sets, prerequisite roadmap, and revision tracker.">
  <title>Coding Course v3</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <a class="skip-link" href="#app">跳至內容</a>
  <header class="topbar">
    <a class="brand" href="#/dashboard">Coding Course <small>v3 Preview</small></a>
    <nav aria-label="主選單">
      <a href="#/dashboard">Dashboard</a>
      <a href="#/courses">課程</a>
      <a href="#/roadmap">知識地圖</a>
      <a href="#/problems">題庫</a>
      <a href="#/review">複習</a>
      <a href="#/progress">掌握紀錄</a>
    </nav>
    <div class="header-actions">
      <button id="theme" type="button" aria-label="切換深淺色" title="切換深淺色">◐</button>
      <a class="v2-link" href="../v2/#/home">v2 ↗</a>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>© 2026 Coding Course · v3 獨立預覽 · <a href="../v2/">保留原始 v2</a> · 教材來源：Notion / 已保存的原始快照</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="attempt-dialog" aria-labelledby="attempt-title">
    <form id="attempt-form">
      <h2 id="attempt-title">紀錄題目</h2>
      <label>目前狀態
        <select name="status">
          <option value="todo">尚未開始</option>
          <option value="trying">嘗試中</option>
          <option value="wa">WA／待訂正</option>
          <option value="ac">AC</option>
        </select>
      </label>
      <label>錯誤類型
        <select name="reason">
          <option value="">尚未分類</option>
          <option value="題意理解">題意理解</option>
          <option value="演算法觀念">演算法觀念</option>
          <option value="實作錯誤">實作錯誤</option>
          <option value="邊界條件">邊界條件</option>
          <option value="時間複雜度">時間複雜度</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <label>錯題筆記<textarea name="note" rows="4" placeholder="這次錯在哪？下次怎麼避免？"></textarea></label>
      <div class="actions">
        <button class="button secondary" type="button" id="attempt-cancel">取消</button>
        <button class="button" type="submit">儲存紀錄</button>
      </div>
    </form>
  </dialog>
  <!-- Original source datasets are loaded unchanged. -->
  <script src="../data/notion_catalog_snapshot.js"></script>
  <script src="../data/notion_courses_part1.js"></script>
  <script src="../data/notion_courses_part2.js"></script>
  <script src="../data/notion_courses_part3.js"></script>
  <script src="../data/notion_courses_part4.js"></script>
  <script src="../data/notion_courses_part5.js"></script>
  <script src="../data/notion_ladders.js"></script>
  <script src="../data/notion_image_mirror.js"></script>
  <script src="../data/roadmap.js"></script>
  <script src="topic-mappings.js?v=3"></script>
  <script src="learning.js?v=3"></script>
  <script src="catalog.js?v=3"></script>
  <script src="source.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
