name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install renderer dependencies
        run: npm install --no-audit --no-fund

      - name: Build Notion renderer
        run: npm run build:notion

      - name: Smoke test live Notion API
        run: python3 scripts/production_smoke.py

      - name: Persist generated renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v2/notion-renderer.js v2/notion-renderer.css v2/notion-assets || true
          if ! git diff --cached --quiet; then
            git commit -m "build: update Notion renderer bundle"
            git push
          fi

      - name: Prepare deploy directory
        run: |
          rm -rf site
          mkdir site
          rsync -a ./ site/ \
            --exclude site \
            --exclude node_modules \
            --exclude .git \
            --exclude .github \
            --exclude package.json \
            --exclude package-lock.json \
            --exclude v2/notion-renderer-entry.jsx

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
